[package]
name = "mdwire-wasm"
description = "WASM bindings for mdwire — browser and npm."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen 은 여기에만 둔다. 코어는 의존이 없다 (`SPEC.md` 3절).
[dependencies]
mdwire-core = { path = "../mdwire-core" }
wasm-bindgen = "0.2"

# **`wasm-opt` 에 bulk memory 를 켜 준다.** wasm-pack 이 들고 오는 `wasm-opt` 는
# 기본값이 옛 명세라, 요즘 rustc 가 내는 `memory.fill` 을 보고 검증에서 죽는다.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory']
