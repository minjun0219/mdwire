[workspace]
members = ["crates/mdwire-core", "crates/mdwire-cli", "crates/mdwire-bench", "crates/mdwire-harness", "crates/mdwire-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/minjun0219/mdwire"
homepage = "https://mdwire.minjun.dev"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
