# 변경 기록은 커밋에서 만든다. `git cliff --tag vX.Y.Z -o CHANGELOG.md`.
#
# 손으로 적지 않는 이유 — 커밋 제목이 이미 "무엇이 달라지는지"를 한국어 한 줄로 적고
# 있고(`AGENTS.md`), PR 은 squash 로 들어와서 main 의 커밋 하나가 곧 변경 하나다.
# 같은 말을 두 군데 적으면 드리프트가 난다.

[changelog]
header = """
# 변경 기록

커밋에서 만든다 — `git cliff`. 손으로 고치지 않는다.
"""
# 공백은 템플릿이 직접 관리한다(`trim = false`). 판 하나는 빈 줄 하나로 끝나서,
# 다음 판의 `## ` 앞에 빈 줄이 선다.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## 미발행
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}** — {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
trim = false


[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# `(#12)` 를 PR 링크로 바꾼다.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/minjun0219/mdwire/pull/${1}))" },
]
# 묶음 이름 앞의 주석은 순서를 잡으려고 둔다. 템플릿이 `striptags` 로 걷어낸다.
commit_parsers = [
  # 사이트는 배포물이 아니다 — 패키지의 변경 기록에 섞지 않는다. 사이트만 바꾼 커밋은 판도
  # 내지 않는다(`scripts/prepare-release.sh`). **맨 앞에 둔다** — 처음 맞는 규칙이 이겨서, 뒤에
  # 두면 `^feat` 에 먼저 걸린다.
  { message = "^\\w+\\(site\\)", skip = true },
  # 깨지는 변경은 종류(feat · fix · refactor …)보다 먼저 따로 묶는다 — 하류가 올리기 전에
  # 읽어야 할 것이 맨 위에 선다. 제목의 `!` 나 본문의 `BREAKING CHANGE:` 로 정해진다.
  { field = "breaking", pattern = "true", group = "<!-- 0 -->깨지는 변경" },
  # #84 는 공개 API(`Dialect` · `Options::from` · npm `from` · Go `Options.From`)를 뺐는데
  # 제목에 `!` 가 없어 0.1.10 기록에서 `refactor` 아래 묻혔다. 커밋은 고칠 수 없으니 여기서 바로잡는다.
  { sha = "7b2f5633fc7ee185e92314909398ffada4049032", group = "<!-- 0 -->깨지는 변경" },
  { message = "^feat", group = "<!-- 1 -->새로 할 수 있는 것" },
  { message = "^fix", group = "<!-- 2 -->고친 것" },
  { message = "^perf", group = "<!-- 3 -->성능" },
  { message = "^docs", group = "<!-- 4 -->문서" },
  { message = "^test", group = "<!-- 5 -->테스트" },
  { message = "^(ci|build|chore|refactor)", group = "<!-- 6 -->유지" },
  { message = "^release", skip = true },
  { message = "^wip", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
