# 변경 기록은 커밋에서 만든다. `git cliff --tag vX.Y.Z -o CHANGELOG.md`.
#
# 손으로 적지 않는 이유 — 커밋 제목이 이미 "무엇이 달라지는지"를 한국어 한 줄로 적고
# 있고(`AGENTS.md`), PR 은 squash 로 들어와서 main 의 커밋 하나가 곧 변경 하나다.
# 같은 말을 두 군데 적으면 드리프트가 난다.

[changelog]
header = """
# 변경 기록

커밋에서 만든다 — `git cliff`. 손으로 고치지 않는다.
"""
# 공백은 템플릿이 직접 관리한다(`trim = false`). 판 하나는 빈 줄 하나로 끝나서,
# 다음 판의 `## ` 앞에 빈 줄이 선다.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## 미발행
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}** — {% endif %}{{ commit.message }}\
{% endfor %}
{% endfor %}
"""
trim = false


[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
# `(#12)` 를 PR 링크로 바꾼다.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/minjun0219/mdwire/pull/${1}))" },
]
# 묶음 이름 앞의 주석은 순서를 잡으려고 둔다. 템플릿이 `striptags` 로 걷어낸다.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->새로 할 수 있는 것" },
  { message = "^fix", group = "<!-- 1 -->고친 것" },
  { message = "^perf", group = "<!-- 2 -->성능" },
  { message = "^docs", group = "<!-- 3 -->문서" },
  { message = "^test", group = "<!-- 4 -->테스트" },
  { message = "^(ci|build|chore)", group = "<!-- 5 -->유지" },
  { message = "^release", skip = true },
  { message = "^wip", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
