# 릴리스 바이너리를 PR 에서 미리 만들어 돌려 본다 — 릴리스 때 처음 도는 러너가 없게.
#
# 매트릭스와 빌드·돌려 보기 단계는 `release.yml` 의 `cli` 잡과 같다. 한쪽을 고치면 다른 쪽도 고친다.
# 바이너리에 닿는 경로가 바뀐 PR 에서만 돈다.
name: binaries

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/binaries.yml
      - crates/mdwire-core/**
      - crates/mdwire-cli/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 툴체인
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: 빌드
        run: cargo build --release --locked -p mdwire-cli --target ${{ matrix.target }}
      - name: 돌려 보기
        run: |
          out=$(printf '**bold**' | target/${{ matrix.target }}/release/mdwire --channel telegram-html)
          test "$out" = "<b>bold</b>" || { echo "::error::바이너리 출력이 다르다: $out"; exit 1; }
          file target/${{ matrix.target }}/release/mdwire
