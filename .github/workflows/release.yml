# 릴리스에 산출물을 붙이고 레지스트리에 올린다 — CLI 바이너리와 npm 패키지 tarball,
# 그리고 crates.io(mdwire-core · mdwire-cli)와 npm(@minjun0219/mdwire).
#
# 레지스트리를 거치지 않고 릴리스에서 바로 가져다 쓸 수도 있다:
#   npm install https://github.com/minjun0219/mdwire/releases/download/v0.1.1/mdwire-0.1.1.tgz
#   curl -L …/mdwire-v0.1.1-aarch64-apple-darwin.tar.gz | tar xz
#
# **태그에서 만든다.** 릴리스는 그 태그의 소스여야 재현이 된다 — `main` 이 앞서 있어도
# 거기서 만들지 않는다. 그래서 포장이 바뀌면 새 버전을 단다.
# 이미 있는 릴리스에 다시 붙이려면 `workflow_dispatch` 로 태그를 넘긴다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 산출물을 붙일 태그 (예 v0.1.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # 릴리스는 한 곳에서 한 번만 만든다. 산출물 잡들이 각자 만들면 서로 경합한다.
  #
  # **초안으로 만들고, 산출물이 다 붙은 뒤에 공개한다.** 바로 공개하면 뒤의 빌드·스모크·
  # 업로드 어느 하나가 죽어도 비었거나 반쪽인 릴리스가 Latest 로 보인다 — v0.1.0 이
  # 그랬다(CLI 만 붙고 npm 은 실패). 초안이면 실패한 판은 사용자 눈에 안 띈 채 고칠 수 있다.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 릴리스 만들기 (없으면)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          # 본문은 CHANGELOG 의 그 버전 항목이다 — git-cliff 가 커밋에서 만든 것.
          awk -v v="${TAG#v}" '$0 ~ "^## " v " " {p=1; next} /^## /{if (p) exit} p' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --title "mdwire ${TAG#v}" --notes-file notes.md

  cli:
    needs: release
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 툴체인
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: 빌드
        run: cargo build --release --locked -p mdwire-cli --target ${{ matrix.target }}
      - name: 묶기
        run: |
          NAME=mdwire-$TAG-${{ matrix.target }}
          mkdir -p dist/$NAME
          cp target/${{ matrix.target }}/release/mdwire README.md LICENSE CHANGELOG.md dist/$NAME/
          tar -C dist -czf dist/$NAME.tar.gz $NAME
          echo "ASSET=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
      - name: 릴리스에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 툴체인
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: 패키지
        run: |
          ./scripts/build-npm.sh
          # ci.yml 과 같다 — 스모크는 CI 에서 Bun 이 없으면 실패한다. 올리는 패키지도 Bun 에서 본다.
          npm install -g typescript bun
          ./scripts/smoke.sh
          npm pack ./pkg
          # 스코프 패키지는 `minjun0219-mdwire-X.tgz` 로 나온다. 릴리스 자산 이름은 `mdwire-X.tgz` 로
          # 둔다 — README 설치 줄·릴리스 스크립트의 치환·본문 해시가 이 이름을 본다.
          mv minjun0219-mdwire-*.tgz "mdwire-${TAG#v}.tgz"
          echo "ASSET=mdwire-${TAG#v}.tgz" >> "$GITHUB_ENV"
      - name: 릴리스에 붙이기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  # 산출물 잡이 전부 성공했을 때만 공개한다.
  #
  # **공개 전에 산출물의 SHA-256 을 본문 끝에 붙인다.** 레지스트리 없이 릴리스 자산을 URL 로
  # 설치하는 쪽은 태그만으로는 무결성을 못 잡는다 — 해시로 고정한다. 이미 공개된 릴리스를
  # workflow_dispatch 로 다시 붙인 경우에도 산출물이 `--clobber` 로 새로 올라가 해시가
  # 바뀌므로, 이미 있는 절을 떼고 새로 붙인다.
  publish:
    needs: [cli, npm]
    runs-on: ubuntu-latest
    steps:
      - name: 해시를 본문에 붙이고 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="--repo $GITHUB_REPOSITORY"
          mkdir assets
          gh release download "$TAG" $R --dir assets
          # 해시 절은 늘 본문 끝에 붙으므로 그 제목부터 끝까지가 옛 절이다.
          # 옛 절 앞의 빈 줄도 떼야 다시 돌릴 때마다 빈 줄이 쌓이지 않는다.
          gh release view "$TAG" $R --json body --jq .body \
            | awk '/^## SHA-256/ {exit} /^[[:space:]]*$/ {gap = gap $0 "\n"; next} {printf "%s%s\n", gap, $0; gap = ""}' \
            > notes.md
          {
            echo
            echo '## SHA-256'
            echo
            echo '```'
            (cd assets && sha256sum *)
            echo '```'
          } >> notes.md
          gh release edit "$TAG" $R --notes-file notes.md
          gh release edit "$TAG" $R --draft=false

  # ── 레지스트리 ──────────────────────────────────────────────────────────────
  #
  # **인증은 Trusted Publishing(OIDC)이다 — 저장소에 토큰을 두지 않는다.** 잡마다 GitHub 이
  # 서명한 신분증(`id-token: write`)을 레지스트리가 받아, 이 저장소의 이 워크플로(`release.yml`)
  # 라는 것을 확인하고 그 자리에서 짧은 토큰을 내준다. 설정은 레지스트리 쪽 패키지 설정에 있다.
  #
  # **첫 판은 사람이 토큰으로 올린다.** Trusted Publishing 은 이미 있는 패키지에만 걸 수 있다.
  # 그래서 레지스트리에 이름이 아직 없으면 경고만 남기고 건너뛴다 — 이 워크플로를 먼저
  # 머지해도 릴리스가 깨지지 않는다.
  #
  # **이미 올라간 버전은 건너뛴다.** 레지스트리는 같은 버전을 다시 받지 않는다 —
  # workflow_dispatch 로 다시 돌려도 여기서 죽지 않게.
  #
  # 공개된 GitHub 릴리스(`publish`) 뒤에만 돈다. 레지스트리는 되돌릴 수 없어서(crates.io 는
  # yank 만, npm 은 72시간 안에만 unpublish) 산출물이 다 선 판만 올린다.
  crates:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 올릴 크레이트
        id: todo
        run: |
          VERSION=${TAG#v}
          UA="mdwire release (https://github.com/$GITHUB_REPOSITORY)"
          todo=""
          # 순서가 곧 게시 순서다 — CLI 가 코어에 기댄다.
          for c in mdwire-core mdwire-cli; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "https://crates.io/api/v1/crates/$c")
            case "$code" in
              200) ;;
              404) echo "::warning::$c 가 아직 crates.io 에 없다 — 첫 판은 토큰으로 손수 올린다. 건너뛴다."; continue ;;
              *) echo "::error::crates.io 가 $code 를 줬다"; exit 1 ;;
            esac
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "https://crates.io/api/v1/crates/$c/$VERSION")
            if [ "$code" = 200 ]; then
              echo "$c $VERSION 은 이미 있다"
            else
              todo="$todo $c"
            fi
          done
          echo "crates=${todo# }" >> "$GITHUB_OUTPUT"
      # 외부 액션을 안 쓰는 이 저장소의 예외다. OIDC 토큰을 crates.io 토큰으로 바꾸고, 잡이
      # 끝나면 되돌리는(revoke) 공식 액션이라 손으로 짜지 않는다. 태그가 아니라 커밋으로 고정한다.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.todo.outputs.crates != ''
        id: auth
      - name: 올리기
        if: steps.todo.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.todo.outputs.crates }}
        run: |
          rustup update --no-self-update stable
          rustup default stable
          # cargo publish 는 올린 판이 인덱스에 보일 때까지 기다린다 — 다음 크레이트가 바로 찾는다.
          for c in $CRATES; do
            cargo publish -p "$c" --locked
          done

  # **릴리스에 붙은 tarball 을 그대로 올린다.** 다시 빌드하면 본문의 SHA-256 과 다른 파일이
  # 레지스트리에 간다. provenance(어느 저장소·커밋·워크플로가 만들었나)는 Trusted Publishing
  # 이면 npm 이 스스로 붙인다 — package.json 의 repository.url 이 이 저장소와 같아야 한다.
  npm-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${TAG#v}
          code=$(curl -s -o /dev/null -w '%{http_code}' https://registry.npmjs.org/@minjun0219%2fmdwire)
          case "$code" in
            200) ;;
            404) echo "::warning::@minjun0219/mdwire 가 아직 npm 에 없다 — 첫 판은 토큰으로 손수 올린다. 건너뛴다."; exit 0 ;;
            *) echo "::error::npm 레지스트리가 $code 를 줬다"; exit 1 ;;
          esac
          if [ "$(npm view "@minjun0219/mdwire@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@minjun0219/mdwire $VERSION 은 이미 있다"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "mdwire-$VERSION.tgz"
          # Trusted Publishing 은 npm 11.5.1 이상이 필요하다. 러너의 npm 은 10 이다(Node 는 22 라 된다).
          # **전역으로 올리지 않는다** — `npm install -g npm` 은 러너의 /usr/local 에 man 페이지를
          # 쓰다 EACCES 로 죽었다(v0.1.5). npx 로 그 판을 한 번 빌려 쓴다.
          npx --yes npm@^11.5.1 publish "mdwire-$VERSION.tgz"
