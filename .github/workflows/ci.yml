# 게이트. `AGENTS.md` 가 "통과 전에 커밋하지 않는다"고 정한 것을 PR 에서도 강제한다.
#
# 의존은 두지 않는다 — 코어와 같은 원칙이다. 캐시 액션도 쓰지 않는데,
# 이 저장소는 바인딩 층 말고는 의존이 없어서 캐시로 아낄 것이 거의 없기 때문이다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 툴체인
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add clippy
          rustup target add wasm32-unknown-unknown

      # `--locked` — Cargo.lock 을 그대로 쓰고, 갱신이 필요하면 해결하지 말고 실패한다.
      # 게이트가 업스트림 릴리스 타이밍에 따라 흔들리면 실패 원인을 가릴 수 없다.
      #
      # 코퍼스 대조 · 스트리밍 일치 · 할당 회귀 게이트가 전부 여기 들어 있다.
      - name: 테스트
        run: cargo test --workspace --locked

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # 코어는 바인딩 층 없이도 wasm 으로 서야 한다. 호스트 빌드만으로는 안 걸린다.
      - name: wasm 빌드
        run: cargo build -p mdwire-wasm --target wasm32-unknown-unknown --locked

      # 공식 설치 스크립트로 받는다. `cargo install` 은 매번 몇 분씩 컴파일한다.
      - name: wasm-pack 설치
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # 올릴 패키지가 실제로 만들어지는지 본다.
      - name: npm 패키지 빌드
        run: ./scripts/build-npm.sh

      # **빌드만으로는 경계 너머가 안 잡힌다.** 같은 바인딩을 nodejs 타깃으로 한 번 더
      # 만들어 실제로 불러 본다 — bundler 타깃은 번들러 없이 못 불러서다.
      - name: npm 스모크
        run: |
          wasm-pack build crates/mdwire-wasm --release --target nodejs \
            --out-dir ../../pkg-node --out-name mdwire
          node scripts/smoke.mjs
