# 게이트. `AGENTS.md` 가 "통과 전에 커밋하지 않는다"고 정한 것을 PR 에서도 강제한다.
#
# 의존은 두지 않는다 — 코어와 같은 원칙이다. 캐시 액션도 쓰지 않는데,
# 이 저장소는 바인딩 층 말고는 의존이 없어서 캐시로 아낄 것이 거의 없기 때문이다.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release PR 은 봇이 민 브랜치라 위 두 이벤트가 안 뜬다 — `release-pr.yml` 이 이걸로 부른다.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # README 는 영어·한국어 두 벌이 같이 간다(AGENTS.md). 가장 싼 검사라 맨 앞에 둔다.
      - name: README 두 벌
        run: ./scripts/readme-sync.sh

      - name: 툴체인
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add clippy
          rustup target add wasm32-unknown-unknown

      # `--locked` — Cargo.lock 을 그대로 쓰고, 갱신이 필요하면 해결하지 말고 실패한다.
      # 게이트가 업스트림 릴리스 타이밍에 따라 흔들리면 실패 원인을 가릴 수 없다.
      #
      # 코퍼스 대조 · 스트리밍 일치 · 할당 회귀 게이트가 전부 여기 들어 있다.
      - name: 테스트
        run: cargo test --workspace --locked

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # 코어는 바인딩 층 없이도 wasm 으로 서야 한다. 호스트 빌드만으로는 안 걸린다.
      - name: wasm 빌드
        run: cargo build -p mdwire-wasm --target wasm32-unknown-unknown --locked

      # **`curl | sh` 를 쓰지 않는다.** 검증 안 된 원격 스크립트를 게이트 안에서
      # 실행하는 셈이고, 이 워크플로가 액션조차 안 쓰는 이유와 어긋난다. `--locked` 는
      # 체크섬과 잠긴 의존으로 받는다 — 몇 분 더 걸리는 값은 낸다.
      - name: wasm-pack 설치
        run: cargo install wasm-pack --locked

      # **Go 이식은 같은 코퍼스를 통과해야 한다.** 러너에 Go 가 깔려 있어 액션 없이 돈다.
      # 시험의 기대값은 Rust CLI 출력에서 뽑은 것이라(go/testdata/regen.sh), 두 구현이
      # 갈리면 여기서 걸린다.
      - name: go
        working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          cargo build -p mdwire-cli --locked
          MDWIRE_RUST=../target/debug/mdwire go test ./...

      # 올릴 패키지가 실제로 만들어지는지 본다.
      - name: npm 패키지 빌드
        run: ./scripts/build-npm.sh

      # **빌드만으로는 경계 너머가 안 잡힌다.** 만든 패키지를 빈 프로젝트에 실제로
      # 설치해서 `exports` 맵을 거쳐 불러 보고, 첫 소비자의 TypeScript 설정으로
      # 타입까지 본다.
      #
      # **Bun 도 깐다.** 러너 이미지에 없어서 스모크가 Bun 확인을 조용히 건너뛰고
      # 있었다. 액션 대신 npm 으로 받는다 — typescript 와 같은 길이다.
      - name: npm 스모크
        run: |
          npm install -g typescript bun
          ./scripts/smoke.sh

      # **예제도 빌드한다.** 예제는 바로 앞에서 만든 pkg/ 를 쓴다 — API 가 바뀌어 예제가
      # 깨지면 여기서 걸린다. 번들러가 wasm 을 싣는 설정(vite-plugin-wasm)까지 같이 본다.
      - name: 예제 빌드
        working-directory: examples/react-streaming
        run: |
          npm install --no-audit --no-fund
          npm run build

      # **사이트는 site/ 가 바뀔 때만 빌드한다.** 사이트는 npm 에 올라간 패키지를 쓰는 독립
      # 패키지라 위의 pkg/ 와 무관하다. 배포는 Cloudflare Workers Builds 가 한다(site/README.md) —
      # 여기서는 그 빌드가 깨지지 않는지만 본다. 경로 필터는 워크플로 단위라 게이트 안에서 쓸 수
      # 없어서, 기준 커밋과 트리를 비교한다. 기준을 못 얻으면(수동 실행 등) 그냥 돈다.
      - name: 사이트 변경 확인
        id: site
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] \
            && git fetch --no-tags --depth=1 origin "$BASE" \
            && git diff --quiet "$BASE" HEAD -- site/ .github/workflows/ci.yml; then
            echo "site/ 변경 없음 — 사이트 빌드를 건너뛴다"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 패키지 매니저는 pnpm 이다. 버전은 site/package.json 의 `packageManager` 가 정본이고,
      # pnpm 이 그 버전으로 스스로 갈아탄다. 액션 대신 npm 으로 받는다 — 위의 bun 과 같은 길이다.
      - name: 사이트 빌드
        if: steps.site.outputs.changed == 'true'
        working-directory: site
        run: |
          node --version
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
